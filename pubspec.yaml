name: tamil_app
description: Tamil Master - Professional Tamil Learning App for Schools
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  google_fonts: ^4.0.0
  flutter_tts: ^3.8.5
  speech_to_text: ^6.6.0
  path_provider: ^2.1.1
  pdf: ^3.10.7
  intl: ^0.18.1
  flutter_svg: ^2.0.9
  lottie: ^2.7.0
  shimmer: ^3.0.0
  characters: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
