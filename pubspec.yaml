name: tamil_app
description: Tamil  - Professional Tamil Learning App for Schools
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.1.1
  shared_preferences: ^2.2.3
  google_fonts: 6.1.0
  flutter_tts: ^3.8.5
  speech_to_text: ^6.6.0
  characters: ^1.3.0
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  google_sign_in: ^6.2.1
  cloud_firestore: ^4.15.8
  firebase_storage: ^11.6.9
  sqflite: ^2.3.2
  path: ^1.8.3
  file_picker: ^8.0.0+1
  url_launcher: ^6.3.0
  firebase_ui_auth: ^1.14.0
  confetti: ^0.8.0
  audioplayers: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
    - assets/data/

flutter_launcher_icons:
  android: true
  ios: false
  web:
    generate: true
    image_path: "assets/images/29099e40-2686-49d2-af50-5d939b785f80.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  image_path: "assets/images/29099e40-2686-49d2-af50-5d939b785f80.png"
  min_sdk_android: 21
